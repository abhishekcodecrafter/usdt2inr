<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Withdrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="static/css/usdtwidthdrawl.css" />
</head>
<body>
    <div id="spinner" class="loading-state" style="display: none;">
        <div class="loading"></div>
        <div class="loading-text">
            <span style="color: #FFA500;"></span>
            <span> Loading....</span>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="back-arrow" onclick="redirectTo('/fullprofile')">
                <i class="fas fa-arrow-left"></i>
            </div>
            <h1>USDT Withdrawal</h1>
        </header>

        <div class="card">
            <div class="balance-section">
                <div class="balance-label">Available Balance (USDT)</div>
                <div class="balance-amount">{{user_details['usdt_balance'] | round(2) }}</div>
                <div class="price-inr">≈ ₹{{inrvalue | round(2) }}</div>
            </div>

            <form id="form">
                <div class="form-group">
                    <label for="amount">Amount (USDT):</label>
                    <input type="text" class="form-control" id="amount" name="amount" placeholder="Enter Amount in USDT" required autocomplete="on" autofocus>
                </div>
                <div class="form-group">
                    <label for="usdtaddress">USDT Address:</label>
                    <input type="text" class="form-control" id="usdtaddress" name="usdtaddress" placeholder="Enter Your USDT Address" required autocomplete="on">
                </div>
                <div class="form-group">
                    <label for="transactionPassword">Transaction Password:</label>
                    <input type="password" class="form-control" id="transactionPassword" name="transactionPassword" placeholder="Enter Your Transaction Password" required autocomplete="on">
                </div>
                <div id="verificationBox" hidden>
                    <p id="verificationMessage"></p>
                </div>
                <button id="sendotp" class="btn" type="submit">Submit</button>
            </form>
        </div>

        <div class="instructions">
            <h3>Instructions:</h3>
            <ol>
                <li>Please make sure you have enough USDT to trade.</li>
                <li>Available withdrawal time: 10 AM to 10 PM, Monday to Sunday.</li>
            </ol>
        </div>
    </div>

    <div id="phone" hidden>{{ user_details['phone_number'] }}</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="static/js/toaster.js"></script>
    <script src="static/js/usdtwidthdrawl.js"></script>
    <script src="static/js/spinner.js"></script>
    <script>
        function redirectTo(url) {
            document.getElementById('spinner').style.display = 'flex';
            setTimeout(() => {
                window.location.href = url;
            }, 1000);
        }
    </script>
</body>
</html>
