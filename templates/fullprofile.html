<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Profile Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="static/css/fullprofile.css" />
</head>
<body>
    <div id="spinner" class="loading-state" style="display: none;">
        <div class="loading"></div>
        <div class="loading-text">
            <span style="color: #FFA500;"></span>
            <span> Loading....</span>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div>
                <div class="greeting">Welcome</div>
                <div class="name">{{ user_details['name'] }}</div>
            </div>
            <img class="profile-pic" src="static/assets/avatars/av18.jpg" alt="Profile Picture" onclick="redirectTo('/profile')">
        </header>

        <div class="card balance-section">
            <div class="balance-label">Total Balance</div>
            <div class="balance-amount">$<span id="usdtBalance">{{user_details['usdt_balance'] | round(2) }}</span></div>
            <div class="balance-change">≈ ₹<span id="inrValue">{{inrvalue | round(2) }}</span></div>
        </div>

        <div class="list-container">
            <div class="list-item" onclick="redirectTo('/profile?redirect=fullprofile')">
                <div class="icon"><i class="fas fa-user"></i></div>
                <div class="name">Personal</div>
                <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
            <div class="list-item" onclick="redirectTo('/usdt_deposit_info?redirect=fullprofile')">
                <div class="icon"><i class="fas fa-wallet"></i></div>
                <div class="name">Deposit</div>
                <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
            <div class="list-item" onclick="redirectTo('/inr_exchange?redirect=profile')">
                <div class="icon"><i class="fas fa-exchange-alt"></i></div>
                <div class="name">Exchange</div>
                <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
            <div class="list-item" onclick="redirectTo('/usdtwidthdrawl')">
                <div class="icon"><i class="fas fa-money-bill-wave"></i></div>
                <div class="name">USDT Withdrawal</div>
                <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
            <div class="list-item" onclick="redirectTo('/help')">
                <div class="icon"><i class="fas fa-question-circle"></i></div>
                <div class="name">Help</div>
                <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <div onclick="redirectTo('/dashboard' )" class="nav-item">
            <i class="fas fa-home"></i>
            <span class="nav-text">Home</span>
        </div>
        <div onclick="redirectTo('/transactions' )" class="nav-item">
            <i class="fas fa-exchange-alt"></i>
            <span class="nav-text">Transactions</span>
        </div>
        <div onclick="redirectTo('/refer')" class="nav-item">
            <i class="fas fa-user-plus"></i>
            <span class="nav-text">Refer</span>
        </div>
        <div onclick="redirectTo('/fullprofile')" class="nav-item active">
            <i class="fas fa-cog"></i>
            <span class="nav-text">Settings</span>
        </div>
    </nav>

    <div id="tusername" hidden>{{ user_details['t_me'] }}</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="static/js/toaster.js"></script>
    <script src="static/js/fullprofile.js"></script>
    <script src="static/js/spinner.js"></script>
    <script>
        function redirectTo(url) {
            document.getElementById('spinner').style.display = 'flex';
            setTimeout(() => {
                window.location.href = url;
            }, 1000);
        }

        function showSuccessMessage(message) {
            var successMsg = document.getElementById('successmsg');
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            setTimeout(function() {
                successMsg.style.display = 'none';
            }, 3000);
        }

        // Load saved avatar on page load
        document.addEventListener('DOMContentLoaded', function () {
            var savedAvatar = localStorage.getItem('selectedAvatar');
            var avatar = document.querySelector('.profile-pic');
            if (savedAvatar) {
                avatar.src = savedAvatar;
            }
        });
    </script>
</body>
</html>
