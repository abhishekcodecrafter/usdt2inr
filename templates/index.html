<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4A4FE4;
            --secondary-color: #6C70E0;
            --background-color: #F4F6FA;
            --card-background: #FFFFFF;
            --text-color: #333333;
            --text-light: #666666;
            --success-color: #4CAF50;
            --danger-color: #F44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container svg {
            max-width: 100%;
            height: auto;
        }

        .content-container {
            background-color: var(--card-background);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            width: 100%;
            margin-bottom: 1rem;
        }

        .input-group-prepend {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-right: none;
            padding: 0.375rem 0.75rem;
            color: var(--text-light);
            border-top-left-radius: 0.25rem;
            border-bottom-left-radius: 0.25rem;
            display: flex;
            align-items: center;
        }

        input[type="tel"] {
            flex-grow: 1;
            padding: 0.375rem 0.75rem;
            border: 1px solid #ddd;
            font-size: 1rem;
            border-top-right-radius: 0.25rem;
            border-bottom-right-radius: 0.25rem;
        }

        button {
            width: 100%;
            padding: 0.375rem 0.75rem;
            border: none;
            border-radius: 0.25rem;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        #resendOtpText {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--primary-color);
            cursor: pointer;
        }

        #verificationBox {
            background-color: var(--success-color);
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .loading-state {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        .loading {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .content-container {
                padding: 1rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .input-group, button {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div id="spinner" class="loading-state" style="display: none;">
        <div class="loading"></div>
        <div class="loading-text">
            <span style="color: #FFA500;">Hmm,</span>
            <span> Loading....</span>
        </div>
    </div>

    <div class="container">
        <div id="logoContainer" class="logo-container">
            <svg width="192" height="33" viewBox="0 0 192 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Your SVG content here -->
            </svg>
        </div>

        <div class="content-container">
            <form id="form" class="mb-5" id="authForm">
                <h2>Login/Signup</h2>
                <div id="verificationBox" hidden>
                    <p id="verificationMessage"></p>
                </div>
                <div id="sendotp" class="row">
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text" id="basic-addon1">+91</span>
                        </div>
                        <input type="tel" id="phoneNumber" class="form-control" placeholder="Enter your mobile number" aria-label="Number" aria-describedby="basic-addon1">
                    </div>
                    <button type="button" id="otpButton" onclick="sendOTP()">Get OTP</button>
                </div>
                <div class="row">
                    <div class="input-group">
                        <input type="tel" id="otp" placeholder="Enter OTP received" hidden required>
                    </div>
                </div>
                <button type="button" id="btn-verification" onclick="authenticateUser()" class="btn" hidden>Login/Signup</button>
                <span id="resendOtpText" onclick="sendOTP()" hidden>Resend OTP</span>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="static/js/index.js"></script>
    <script src="static/js/spinner.js"></script>
</body>
</html>
