<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="static/css/refer.css" />
</head>
<body>
    <div class="container">
        <section class="earnings-card">
            <div class="earnings-label">Total Earnings</div>
            <div class="earnings-amount">$1,234.56</div>
        </section>

        <section class="referral-section">
            <h2 class="referral-title">Refer & Earn</h2>
            <div class="referral-code-container">
                <div class="referral-code" id="referralCode">RUPAL1234</div>
            </div>
            <button class="share-button" onclick="shareReferralCode()">Copy Link</button>
        </section>

        <div class="tabs">
            <div class="tab active" onclick="showTab('referralEarnings')">Referrals</div>
            <div class="tab" onclick="showTab('depositEarnings')">Earning</div>
        </div>

        <div id="referralEarnings" class="tab-content">
            <div class="referral-item">
                <div class="referral-info">
                    <div class="referral-id">User123</div>
                    <div class="referral-date">May 15, 2023</div>
                </div>
                <div class="referral-amount">+$50.00</div>
            </div>
            <div class="referral-item">
                <div class="referral-info">
                    <div class="referral-id">User456</div>
                    <div class="referral-date">May 10, 2023</div>
                </div>
                <div class="referral-amount">+$30.00</div>
            </div>
            <div class="referral-item">
                <div class="referral-info">
                    <div class="referral-id">User789</div>
                    <div class="referral-date">May 5, 2023</div>
                </div>
                <div class="referral-amount">+$25.00</div>
            </div>
        </div>

        <div id="depositEarnings" class="tab-content" style="display: none;">
            <div class="referral-item">
                <div class="referral-info">
                    <div class="referral-id">User123</div>
                    <div class="referral-date">May 20, 2023</div>
                </div>
                <div class="referral-amount">+$10.00</div>
            </div>
            <div class="referral-item">
                <div class="referral-info">
                    <div class="referral-id">User456</div>
                    <div class="referral-date">May 18, 2023</div>
                </div>
                <div class="referral-amount">+$15.00</div>
            </div>
            <div class="referral-item">
                <div class="referral-info">
                    <div class="referral-id">User789</div>
                    <div class="referral-date">May 12, 2023</div>
                </div>
                <div class="referral-amount">+$5.00</div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <div onclick="redirectTo('/dashboard')" class="nav-item">
            <i class="fas fa-home"></i>
            <span class="nav-text">Home</span>
        </div>
        <div onclick="redirectTo('/transactions')" class="nav-item">
            <i class="fas fa-exchange-alt"></i>
            <span class="nav-text">Transactions</span>
        </div>
        <div onclick="redirectTo('/refer')" class="nav-item active">
            <i class="fas fa-user-plus"></i>
            <span class="nav-text">Refer</span>
        </div>
        <div onclick="redirectTo('/fullprofile')" class="nav-item">
            <i class="fas fa-cog"></i>
            <span class="nav-text">Settings</span>
        </div>
    </nav>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="static/js/toaster.js"></script>

    <script src="static/js/refer.js"></script>

</body>
</html>
