<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Withdrawals Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="static/css/cwp.css" />
</head>
<body>
    <div id="spinner" class="loading-state" style="display: none;">
        <div class="loading"></div>
        <div class="loading-text">
            <span style="color: #FFA500;"></span>
            <span> Loading....</span>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="back-arrow" onclick="history.back()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <h1>Change Withdrawals Password</h1>
        </header>

        <div class="card">
            <form id="form">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="Enter your new password" name="newPassword" required>
                </div>
                
                <div class="form-group">
                    <label for="reenterPassword">Confirm New Password</label>
                    <input type="password" class="form-control" id="reenterPassword" placeholder="Re-enter your new password" name="reenterPassword" required>
                    <div id="passwordMatchError"></div>
                </div>

                <div class="form-group">
                    <label for="securityOTP">OTP Verification</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="securityOTP" placeholder="Enter OTP" name="securityOTP" required>
                        <button type="button" class="btn" onclick="sendOTP()" id="otpButton">Send OTP</button>
                    </div>
                    <div id="verificationBox" hidden>
                        <p id="verificationMessage"></p>
                    </div>
                </div>

                <button type="submit" class="btn btn-block" id="changePassword">Change Password</button>
            </form>
        </div>
    </div>

    <div id="phoneNumber" hidden>{{user_phonenumber}}</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="static/js/toaster.js"></script>
    <script src="static/js/cwp.js"></script>
    <script src="static/js/spinner.js"></script>
</body>
</html>
