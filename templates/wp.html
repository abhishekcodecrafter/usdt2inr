<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Withdrawals Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="static/css/wp.css" />
</head>
<body>
    <div id="spinner" class="loading-state" style="display: none;">
        <div class="loading"></div>
        <div class="loading-text">
            <span style="color: #FFA500;"></span>
            <span> Loading....</span>
        </div>
    </div>

    <div id="phoneNumber" hidden>{{user_phonenumber}}</div>

    <div class="container">
        <h2>Set Up Withdrawals Password</h2>

        <div class="card">
            <div id="verificationBox" hidden>
                <p id="verificationMessage"></p>
            </div>

            <form id="form">
                <div class="form-group">
                    <label for="newPassword">Enter Password</label>
                    <input type="password" id="newPassword" placeholder="Enter Password" name="newPassword" required>
                </div>

                <div class="form-group">
                    <label for="reenterPassword">Re-Enter Password</label>
                    <input type="password" id="reenterPassword" placeholder="Re-Enter Password" name="reenterPassword" required>
                    <div id="passwordMatchError"></div>
                </div>

                <button type="submit" id="changePassword" class="btn">Save & Proceed</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="static/js/toaster.js"></script>
    <script>
        $(document).ready(function() {
            const form = $('#form');
            const newPasswordInput = $('#newPassword');
            const reenterPasswordInput = $('#reenterPassword');
            const passwordMatchError = $('#passwordMatchError');
            const verificationBox = $('#verificationBox');
            const verificationMessage = $('#verificationMessage');
            const spinner = $('#spinner');

            form.on('submit', function(e) {
                e.preventDefault();
                const newPassword = newPasswordInput.val();
                const reenterPassword = reenterPasswordInput.val();

                if (newPassword !== reenterPassword) {
                    passwordMatchError.text('Passwords do not match');
                    return;
                }

                passwordMatchError.text('');
                spinner.show();

                // AJAX call to change password
                $.ajax({
                    url: '/change_wdtpassword',
                    method: 'POST',
                    data: {
                        newPassword: newPassword,
                        reenterPassword: reenterPassword,
                        phoneNumber: $('#phoneNumber').text()
                    },
                    success: function(response) {
                        spinner.hide();
                        if (response.success) {
                            verificationMessage.text('Password changed successfully');
                            verificationBox.show().removeClass('error').addClass('success');
                            setTimeout(function() {
                                window.location.href = "/profile";
                            }, 2000);
                        } else {
                            verificationMessage.text(response.message || 'Failed to change password');
                            verificationBox.show().removeClass('success').addClass('error');
                        }
                    },
                    error: function() {
                        spinner.hide();
                        verificationMessage.text('An error occurred. Please try again.');
                        verificationBox.show().removeClass('success').addClass('error');
                    }
                });
            });

            // Real-time password match checking
            reenterPasswordInput.on('input', function() {
                if (newPasswordInput.val() !== reenterPasswordInput.val()) {
                    passwordMatchError.text('Passwords do not match');
                } else {
                    passwordMatchError.text('');
                }
            });
        });
    </script>
</body>
</html>
